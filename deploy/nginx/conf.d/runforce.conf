# Proxy reverso de Nginx hacia Gunicorn (servicio `web`, puerto 8000 interno).
# Los archivos estaticos (admin, swagger) los sirve WhiteNoise dentro de
# Django/Gunicorn; Nginx solo sirve /media/ directo desde el volumen
# compartido, que es mas eficiente para archivos subidos (fotos de perfil).

upstream runforce_api {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://runforce_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS: una vez que la instancia tenga un dominio (Let's Encrypt no emite
# certificados para IPs sueltas), agregar un servicio `certbot` con el
# volumen `./deploy/nginx/conf.d` compartido y un `server { listen 443 ssl; }`
# aqui. Mientras tanto, ver docs/despliegue.md para el flujo con Certbot
# a nivel de sistema operativo.
