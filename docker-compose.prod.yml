# Override de PRODUCCION.
# Se debe indicar explicitamente con -f (no se carga solo, a diferencia de
# docker-compose.override.yml). Usa gunicorn (CMD del Dockerfile).
#
# Nginx corre NATIVO en el host (con el certificado de Certbot para
# runforce.space), no en Docker: aca solo publicamos el puerto de gunicorn
# en loopback (127.0.0.1:8000) para que ese Nginx nativo le haga proxy.
# No se publica en 0.0.0.0: asi el backend no queda expuesto directo a
# internet, solo alcanzable a traves de Nginx. Ver docs/despliegue.md.
#
# DJANGO_SETTINGS_MODULE se fuerza aqui a proposito: el `env_file: .env` de
# docker-compose.yml carga lo que haya en tu .env local (normalmente
# development/DEBUG=True para trabajar dia a dia), y `environment:` siempre
# gana sobre `env_file:` sin importar en que archivo este declarado. Sin este
# override explicito, un .env mal configurado en el servidor levantaria
# produccion en modo development por accidente.

services:
  web:
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
